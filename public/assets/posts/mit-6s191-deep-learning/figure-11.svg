><text x="752" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff"><tspan>return</tspan></text><text x="752" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff"><tspan>9</tspan></text><text x="420" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>B earns nothing at first but has the higher return.</tspan></text><rect x="48" y="364" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Return G = r</tspan><tspan dy="4.5" font-size="10.5">t+1</tspan><tspan dy="-4.5"> + γr</tspan><tspan dy="4.5" font-size="10.5">t+2</tspan><tspan dy="-4.5"> + γ</tspan><tspan dy="-5.7" font-size="10.5">2</tspan><tspan dy="5.7">r</tspan><tspan dy="4.5" font-size="10.5">t+3</tspan><tspan dy="-4.5"> + …</tspan></text></g></svg>
