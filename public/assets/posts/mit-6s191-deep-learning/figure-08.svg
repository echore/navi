<svg xmlns="http://www.w3.org/2000/svg" width="840" height="448" viewBox="0 0 840 448" role="img"><rect width="840" height="448" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>08 / The Reparameterization Trick</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Move the randomness to ε so the gradient can reach μ and σ.</tspan></text><rect x="48" y="104" width="362" height="248" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="70" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>SAMPLE INSIDE THE PATH</tspan></text><text x="70" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>z ~ N(μ, σ</tspan><tspan dy="-4.9" font-size="9.1">2</tspan><tspan dy="4.9">)</tspan></text><rect x="72" y="190" width="96" height="46" rx="12" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="120" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>μ, σ</tspan></text><path d="M172 213 L204 213" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M195.6 218.4 L204 213 L195.6 207.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="210" y="190" width="110" height="46" rx="12" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="265" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>random draw</tspan></text><path d="M324 213 L352 213" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M343.6 218.4 L352 213 L343.6 207.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="358" y="190" width="38" height="46" rx="12" fill="#E1F1E9" stroke="none" stroke-width="1" /><text x="377" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>z</tspan></text><path d="M330 282 L130 282" stroke="#9A4E2C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><text x="234" y="272" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" font-style="normal" text-anchor="middle" fill="#9A4E2C"><tspan>✕</tspan></text><text x="229" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#9A4E2C"><tspan>no clean gradient path back</tspan></text><rect x="430" y="104" width="362" height="248" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="452" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>REPARAMETERIZED</tspan></text><text x="452" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>ε ~ N(0, 1),  z = μ + σε</tspan></text><rect x="454" y="190" width="96" height="46" rx="12" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="502" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>μ, σ</tspan></text><path d="M554 213 L590 213" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M581.6 218.4 L590 213 L581.6 207.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="596" y="190" width="120" height="46" rx="12" fill="#E1F1E9" stroke="none" stroke-width="1" /><text x="656" y="219" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>z = μ + σε</tspan></text><rect x="612" y="262" width="88" height="36" rx="12" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="656" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>ε ~ N(0, 1)</tspan></text><path d="M656 258 L656 242" stroke="#C99355" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M661.4 250.4 L656 242 L650.6 250.4" stroke="#C99355" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M640 248 Q600 300 512 248" stroke="#348B73" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path d="M521.6 250.8 L512 248 L513.5 257.9" stroke="#348B73" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="560" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#348B73"><tspan>gradient flows to μ and σ</tspan></text><rect x="48" y="372" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="400" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>For a fixed ε, z is a differentiable function of μ and σ.</tspan></text></g></svg>
