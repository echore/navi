<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img"><rect width="840" height="400" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>09 / Two Terms Pull in Different Directions</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>The VAE loss balances reconstruction against a regular latent space.</tspan></text><rect x="48" y="104" width="362" height="120" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="66" y="122" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="66" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Reconstruction term</tspan></text><text x="66" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Can the decoder rebuild x from z?</tspan></text><text x="66" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Keeps useful detail in z.</tspan></text><rect x="430" y="104" width="362" height="120" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="448" y="122" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="448" y="156" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>KL term</tspan></text><text x="448" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Does q(z|x) stay close to the prior p(z)?</tspan></text><text x="448" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Keeps the latent space easy to sample.</tspan></text><path d="M80 290 L760 290" stroke="#CDD7D8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="110" cy="290" r="8" fill="#647066" /><text x="110" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>KL too weak</tspan></text><text x="110" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>sharp reconstructions,</tspan></text><text x="110" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>gaps in latent space</tspan></text><circle cx="420" cy="290" r="11" fill="#C99355" /><text x="420" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Balanced</tspan></text><text x="420" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>reasonable detail,</tspan></text><text x="420" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>useful samples</tspan></text><circle cx="730" cy="290" r="8" fill="#647066" /><text x="730" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>KL too strong</tspan></text><text x="730" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>tidy latent space,</tspan></text><text x="730" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>lost detail</tspan></text><text x="80" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>weaker constraint</tspan></text><text x="760" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="end" fill="#647066"><tspan>stronger constraint</tspan></text></g></svg>
