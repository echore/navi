<svg xmlns="http://www.w3.org/2000/svg" width="840" height="458" viewBox="0 0 840 458" role="img"><rect width="840" height="458" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>10 / Two Networks Train Against Each Other</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>The generator tries to fool the discriminator. The discriminator tries not to be fooled.</tspan></text><g transform="translate(0 34)"><rect x="48" y="140" width="100" height="56" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="98" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>noise</tspan></text><text x="98" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>random input</tspan></text><path d="M152 168 L186 168" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M177.6 173.4 L186 168 L177.6 162.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="192" y="116" width="170" height="104" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="210" y="134" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="210" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Generator</tspan></text><text x="210" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>makes a sample</tspan></text><path d="M366 168 L412 192" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M402.0 192.8 L412 192 L407.0 183.3" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="250" y="260" width="112" height="56" rx="12" fill="#E1F1E9" stroke="none" stroke-width="1" /><text x="306" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>real data</tspan></text><text x="306" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>from the dataset</tspan></text><path d="M366 288 L412 230" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M411.0 239.9 L412 230 L402.6 233.3" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="418" y="158" width="190" height="104" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><rect x="436" y="176" width="40" height="6" rx="3" fill="#C99355" stroke="none" stroke-width="1" /><text x="436" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Discriminator</tspan></text><text x="436" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>real or generated?</tspan></text><path d="M612 210 L646 210" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M637.6 215.4 L646 210 L637.6 204.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="652" y="184" width="140" height="52" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="722" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>P(real)</tspan></text><path d="M722 180 Q722 92 520 92 L290 92 L290 108" stroke="#6E98B9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path d="M284.6 103.6 L290 112 L295.4 103.6" stroke="#6E98B9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="520" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="middle" fill="#6E98B9"><tspan>generator update: make samples it calls real</tspan></text><path d="M722 240 Q722 296 600 296 L540 296 L540 270" stroke="#C99355" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" /><path d="M545.4 274.4 L540 266 L534.6 274.4" stroke="#C99355" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="640" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="middle" fill="#C99355"><tspan>discriminator update: tell them apart</tspan></text><rect x="48" y="348" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="376" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>VAE: probabilistic latent variables and reconstruction. GAN: an adversarial objective.</tspan></text></g></g></svg>
