<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img"><rect width="840" height="464" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>04 / Why Distant Signals Fade</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>If each step back multiplies the gradient by 0.5 (a teaching assumption).</tspan></text><rect x="64" y="126" width="44" height="190" rx="5" fill="#348B73" stroke="none" stroke-width="1" /><text x="86" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>0</tspan></text><text x="86" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>1</tspan></text><rect x="130" y="221" width="44" height="95" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="152" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>1</tspan></text><text x="152" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>0.5</tspan></text><rect x="196" y="268.5" width="44" height="47.5" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="218" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>2</tspan></text><text x="218" y="258.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>0.25</tspan></text><rect x="262" y="292.25" width="44" height="23.75" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="284" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>3</tspan></text><text x="284" y="282.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>0.125</tspan></text><rect x="328" y="304.125" width="44" height="11.875" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="350" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>4</tspan></text><rect x="394" y="310.0625" width="44" height="5.9375" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="416" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>5</tspan></text><rect x="460" y="313.03125" width="44" height="2.96875" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="482" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>6</tspan></text><rect x="526" y="314" width="44" height="2" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="548" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>7</tspan></text><rect x="592" y="314" width="44" height="2" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="614" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>8</tspan></text><rect x="658" y="314" width="44" height="2" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="680" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>9</tspan></text><rect x="724" y="314" width="44" height="2" rx="5" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="746" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>10</tspan></text><text x="746" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" fill="#9A4E2C"><tspan>≈0.001</tspan></text><text x="64" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>steps back in time</tspan></text><path d="M700 356 L300 356" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M308.4 350.6 L300 356 L308.4 361.4" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="712" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="start" fill="#C99355"><tspan>BPTT</tspan></text><rect x="48" y="388" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>After ten steps, about 0.001 of the learning signal reaches the earliest input.</tspan></text></g></svg>
