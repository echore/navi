<svg xmlns="http://www.w3.org/2000/svg" width="840" height="416" viewBox="0 0 840 416" role="img"><rect width="840" height="416" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>02 / One Training Step</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>The forward pass only computes. Parameters change after the backward pass.</tspan></text><rect x="48" y="118" width="130" height="136" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="66" y="136" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="66" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Input</tspan></text><text x="66" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>a batch of</tspan></text><text x="66" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>examples</tspan></text><path d="M181 186 L198.5 186" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M190.1 191.4 L198.5 186 L190.1 180.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="201.5" y="118" width="130" height="136" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="219.5" y="136" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="219.5" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Forward</tspan></text><text x="219.5" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>current weights</tspan></text><text x="219.5" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>→ prediction</tspan></text><path d="M334.5 186 L352 186" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M343.6 191.4 L352 186 L343.6 180.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="355" y="118" width="130" height="136" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><rect x="373" y="136" width="40" height="6" rx="3" fill="#C99355" stroke="none" stroke-width="1" /><text x="373" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Loss</tspan></text><text x="373" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>prediction vs.</tspan></text><text x="373" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>target</tspan></text><path d="M488 186 L505.5 186" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M497.1 191.4 L505.5 186 L497.1 180.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="508.5" y="118" width="130" height="136" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="526.5" y="136" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="526.5" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Backprop</tspan></text><text x="526.5" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>chain rule</tspan></text><text x="526.5" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>→ gradients</tspan></text><path d="M641.5 186 L659 186" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M650.6 191.4 L659 186 L650.6 180.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="662" y="118" width="130" height="136" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="680" y="136" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="680" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Update</tspan></text><text x="680" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>optimizer step</tspan></text><text x="680" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>w ← w − η∂L/∂w</tspan></text><path d="M727 258 L727 300 Q727 312 715 312 L125 312 Q113 312 113 300 L113 266" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" /><path d="M118.4 268.4 L113 260 L107.6 268.4" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="420" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>repeat on many batches with the updated weights</tspan></text><rect x="48" y="340" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>η is the learning rate: how big a step the optimizer takes along the gradient.</tspan></text></g></svg>
