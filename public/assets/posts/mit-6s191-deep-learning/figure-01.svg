<svg xmlns="http://www.w3.org/2000/svg" width="840" height="414" viewBox="0 0 840 414" role="img"><rect width="840" height="414" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>01 / One Artificial Neuron</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Weighted inputs, plus a bias, then an activation function.</tspan></text><rect x="48" y="120" width="168" height="50" rx="12" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="68" y="151" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>x</tspan><tspan dy="5.1" font-size="11.9">1</tspan><tspan dy="-5.1"></tspan></text><text x="104" y="151" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>weather</tspan></text><path d="M222 145 L384 203" stroke="#6E98B9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M374.2 205.2 L384 203 L377.9 195.1" stroke="#6E98B9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="300" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#6E98B9"><tspan>w</tspan><tspan dy="4.5" font-size="10.5">1</tspan><tspan dy="-4.5"></tspan></text><rect x="48" y="192" width="168" height="50" rx="12" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="68" y="223" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>x</tspan><tspan dy="5.1" font-size="11.9">2</tspan><tspan dy="-5.1"></tspan></text><text x="104" y="223" font-family="Arial, 