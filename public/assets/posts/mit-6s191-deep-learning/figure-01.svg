tspan><tspan dy="-5.3999999999999995">x</tspan><tspan dy="5.4" font-size="12.6">i</tspan><tspan dy="-5.4"> + b</tspan></text><text x="486" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>weighted sum</tspan></text><text x="486" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>plus bias</tspan></text><path d="M578 219 L616 219" stroke="#C99355" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M607.6 224.4 L616 219 L607.6 213.6" stroke="#C99355" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="624" y="184" width="92" height="70" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="670" y="225" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>f(z)</tspan></text><path d="M720 219 L744 219" stroke="#C99355" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M735.6 224.4 L744 219 L735.6 213.6" stroke="#C99355" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="750" y="194" width="42" height="50" rx="12" fill="#348B73" stroke="none" stroke-width="1" /><text x="771" y="226" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff"><tspan>a</tspan></text><text x="486" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>b = a learned base level</tspan></text><text x="670" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>nonlinearity</tspan></text><rect x="48" y="338" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="366" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Weights set how much each input matters. The bias sets the starting point.</tspan></text></g></svg>
