<svg viewBox="0 0 660 230" role="img" aria-label="How to explain a performance improvement differently to a developer and to an engineering decision maker." xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#F2EEDF;--ink:#2A241B;--ink-soft:#5C5345;--lemon:#D6DD63;--lemon-pale:rgba(214,221,99,.32);--card:rgba(255,255,255,.55);--rule:rgba(42,36,27,.25);--rust:#9A4E2C;--serif:"Cormorant Garamond","Songti SC",Georgia,serif;--sans:"Work Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;--blue:#eaf0f8;--green:#e0f2eb;--purple:#efe8fb;--orange:#fae7d6;--diagram-ink:#243444;--diagram-soft:#667989;--diagram-rule:#cdd7d8--sans:Arial,Helvetica,sans-serif;--serif:Georgia,serif}.d-title{font-family:var(--sans);font-size:16px;fill:var(--diagram-ink);font-weight:600}
.d-sub{font-family:var(--sans);font-size:12.7px;fill:var(--diagram-soft)}
.d-kicker{font-family:var(--sans);font-size:11px;fill:var(--diagram-soft);letter-spacing:.4px}
.d-call{font-family:var(--sans);font-size:14px;fill:var(--diagram-ink);font-weight:500}
.d-head{font-family:var(--sans);font-size:16px;fill:var(--diagram-ink);font-weight:600}
.d-body{font-family:var(--sans);font-size:12.5px;fill:var(--diagram-ink)}
.d-note{font-family:var(--sans);font-size:11.5px;fill:var(--diagram-soft)}</style>
  <rect x="6" y="12" width="315" height="172" rx="12" fill="#e0f2eb" stroke="#cdd7d8"></rect>
  <text x="24" y="38" class="d-kicker">FOR A DEVELOPER</text><text x="24" y="67" class="d-head">“Will this work for my setup?”</text>
  <text x="24" y="96" class="d-body">Models, hardware, benchmark method,</text><text x="24" y="116" class="d-body">compatibility, known limitations,</text><text x="24" y="136" class="d-body">migration steps and debugging.</text>
  <text x="24" y="167" class="d-note">Evidence: reproducible technical results</text>
  <rect x="338" y="12" width="315" height="172" rx="12" fill="#fae7d6" stroke="#cdd7d8"></rect>
  <text x="356" y="38" class="d-kicker">FOR AN ENGINEERING LEAD</text><text x="356" y="67" class="d-head">“Is the change worth it?”</text>
  <text x="356" y="96" class="d-body">Cost per task, service targets,</text><text x="356" y="116" class="d-body">operational risk, engineering time,</text><text x="356" y="136" class="d-body">and the migration trade-off.</text>
  <text x="356" y="167" class="d-note">Evidence: workload-specific total value</text>
  <text x="330" y="218" text-anchor="middle" class="d-note">Same underlying truth. Different decision context.</text>
</svg>
