"#647066"><tspan>0.15</tspan></text><rect x="402" y="282" width="158" height="58" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="481" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" fill="#647066"><tspan>0.09</tspan></text><rect x="568" y="282" width="158" height="58" rx="12" fill="#348B73" stroke="none" stroke-width="1" /><text x="647" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff"><tspan>0.86</tspan></text><text x="236" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="start" fill="#348B73"><tspan>Diagonal: positive pairs, pushed up.</tspan></text><text x="528" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="start" fill="#647066"><tspan>Off-diagonal: negative pairs, pushed down.</tspan></text><rect x="48" y="386" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>This lets a sentence retrieve images: both are mapped into one comparable space.</tspan></text></g></svg>
