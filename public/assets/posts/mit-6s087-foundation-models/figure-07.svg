<svg xmlns="http://www.w3.org/2000/svg" width="840" height="462" viewBox="0 0 840 462" role="img"><rect width="840" height="462" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>07 / Contrastive Learning Scores Every Pair</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Training raises similarity for matching pairs and lowers it for the rest.</tspan></text><text x="315" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>“a cat on the sofa”</tspan></text><text x="481" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>“a rocket launch”</tspan></text><text x="647" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>“a sunny beach”</tspan></text><rect x="48" y="161" width="164" height="36" rx="18" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="130" y="184.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>cat image</tspan></text><rect x="236" y="150" width="158" height="58" rx="12" fill="#348B73" stroke="none" stroke-width="1" /><text x="315" y="186" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff"><tspan>0.91</tspan></text><rect x="402" y="150" width="158" height="58" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="481" y="186" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="mid