<svg xmlns="http://www.w3.org/2000/svg" width="840" height="376" viewBox="0 0 840 376" role="img"><rect width="840" height="376" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>11 / Four Ways to Learn to Generate</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Different training objectives, not steps in one pipeline.</tspan></text><rect x="48" y="108" width="174" height="170" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="66" y="126" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="66" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Autoencoder</tspan></text><text x="66" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Encode to a latent z,</tspan></text><text x="66" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>then rebuild x.</tspan></text><rect x="62" y="226" width="146" height="36" rx="10" fill="#fff" stroke="none" stroke-width="1" /><text x="135" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>x → z → x̂</tspan></text><rect x="238" y="108" width="174" height="170" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="256" y="126" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="256" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>VAE</tspan></text><text x="256" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>A distribution over z,</tspan></text><text x="256" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>kept close to a prior.</tspan></text><rect x="252" y="226" width="146" height="36" rx="10" fill="#fff" stroke="none" stroke-width="1" /><text x="325" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>x → (μ, σ) → z → x̂</tspan></text><rect x="428" y="108" width="174" height="170" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><rect x="446" y="126" width="40" height="6" rx="3" fill="#C99355" stroke="none" stroke-width="1" /><text x="446" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>GAN</tspan></text><text x="446" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Generator versus</tspan></text><text x="446" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>discriminator.</tspan></text><rect x="442" y="226" width="146" height="36" rx="10" fill="#fff" stroke="none" stroke-width="1" /><text x="515" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>noise → G → D</tspan></text><rect x="618" y="108" width="174" height="170" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="636" y="126" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="636" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Diffusion</tspan></text><text x="636" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Denoise at many</tspan></text><text x="636" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>noise levels.</tspan></text><rect x="632" y="226" width="146" height="36" rx="10" fill="#fff" stroke="none" stroke-width="1" /><text x="705" y="249" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>noise → … → image</tspan></text><rect x="48" y="300" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Some systems combine these ideas. Separate their training objectives first.</tspan></text></g></svg>
