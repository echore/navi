<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img"><rect width="840" height="450" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>01 / One Task, One Model Versus One Model, Many Tasks</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>A foundation model starts from broad pretraining and becomes the starting point for many tasks.</tspan></text><rect x="48" y="104" width="330" height="250" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="70" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>TASK-SPECIFIC</tspan></text><rect x="70" y="160" width="130" height="36" rx="18" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="135" y="182.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>labeled emails</tspan></text><path d="M206 178 L228 178" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M219.6 183.4 L228 178 L219.6 172.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="234" y="160" width="124" height="36" rx="18" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="296" y="182.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>spam model</tspan></text><rect x="70" y="220" width="130" height="36" rx="18" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="135" y="242.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>labeled photos</tspan></text><path d="M206 238 L228 238" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M219.6 243.4 L228 238 L219.6 232.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="234" y="220" width="124" height="36" rx="18" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="296" y="242.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>cat model</tspan></text><rect x="70" y="280" width="130" height="36" rx="18" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="135" y="302.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>labeled reviews</tspan></text><path d="M206 298 L228 298" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M219.6 303.4 L228 298 L219.6 292.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="234" y="280" width="124" height="36" rx="18" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="296" y="302.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>sentiment model</tspan></text><rect x="398" y="104" width="394" height="250" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>FOUNDATION MODEL</tspan></text><rect x="420" y="158" width="110" height="110" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="438" y="176" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="438" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Broad data</tspan></text><text x="438" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>text, images,</tspan></text><text x="438" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>code, more</tspan></text><path d="M534 213 L556 213" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M547.6 218.4 L556 213 L547.6 207.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="562" y="158" width="96" height="110" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="580" y="176" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="580" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Pretrain</tspan></text><text x="580" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>one set of</tspan></text><text x="580" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>parameters</tspan></text><path d="M662 213 Q680 213 690 168" stroke="#647066" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="694" y="152" width="86" height="32" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="737" y="172.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Q&amp;A</tspan></text><path d="M662 213 Q680 213 690 214" stroke="#647066" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="694" y="198" width="86" height="32" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="737" y="218.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Translation</tspan></text><path d="M662 213 Q680 213 690 260" stroke="#647066" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="694" y="244" width="86" height="32" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="737" y="264.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Summary</tspan></text><path d="M662 213 Q680 213 690 306" stroke="#647066" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="694" y="290" width="86" height="32" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="737" y="310.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Other tasks</tspan></text><text x="420" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>“General” means a shared starting point,</tspan></text><text x="420" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>not “good at everything”.</tspan></text><rect x="48" y="374" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="402" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Results still depend on the data, the objective, later adaptation, and the use case.</tspan></text></g></svg>
