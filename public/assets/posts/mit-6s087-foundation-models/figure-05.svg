<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img"><rect width="840" height="470" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>05 / Encoder-Decoder Versus Decoder-Only</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Both can generate text. They read the input in different ways.</tspan></text><rect x="48" y="104" width="362" height="270" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="70" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>T5 · ENCODER-DECODER</tspan></text><text x="70" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>objective: restore corrupted or masked spans</tspan></text><rect x="70" y="176" width="150" height="32" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="145" y="196.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Thank you &lt;X&gt; me</tspan></text><path d="M145 212 L145 228" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M139.6 219.6 L145 228 L150.4 219.6" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="234" width="150" height="112" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="88" y="252" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="88" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Encoder</tspan></text><text x="88" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>reads all of the</tspan></text><text x="88" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>input at once</tspan></text><path d="M224 290 L250 290" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M241.6 295.4 L250 290 L241.6 284.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="256" y="234" width="136" height="112" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="274" y="252" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="274" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Decoder</tspan></text><text x="274" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>generates, using</tspan></text><text x="274" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>the encoding</tspan></text><path d="M324 228 L324 212" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M329.4 220.4 L324 212 L318.6 220.4" stroke="#647066" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="256" y="176" width="136" height="32" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><text x="324" y="196.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>&lt;X&gt; for inviting</tspan></text><rect x="430" y="104" width="362" height="270" rx="18" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="452" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>GPT · DECODER-ONLY</tspan></text><text x="452" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>objective: predict the next token</tspan></text><rect x="452" y="186" width="170" height="120" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="470" y="204" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="470" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Decoder stack</tspan></text><text x="470" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>many layers over the</tspan></text><text x="470" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>context so far</tspan></text><rect x="452" y="322" width="39" height="30" rx="15" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="471.5" y="341.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>The</tspan></text><rect x="495" y="322" width="39" height="30" rx="15" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="514.5" y="341.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>cat</tspan></text><rect x="538" y="322" width="39" height="30" rx="15" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="557.5" y="341.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>sat</tspan></text><rect x="581" y="322" width="39" height="30" rx="15" fill="#C99355" stroke="none" stroke-width="1" /><text x="600.5" y="341.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff"><tspan>on</tspan></text><text x="640" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="start" fill="#647066"><tspan>causal mask</tspan></text><rect x="640" y="206" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="666" y="206" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="692" y="206" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="718" y="206" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="744" y="206" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="640" y="232" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="666" y="232" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="692" y="232" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="718" y="232" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="744" y="232" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="640" y="258" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="666" y="258" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="692" y="258" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="718" y="258" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="744" y="258" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="640" y="284" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="666" y="284" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="692" y="284" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="718" y="284" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="744" y="284" width="23" height="23" rx="4" fill="#fff" stroke="#CDD7D8" stroke-width="1" /><rect x="640" y="310" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="666" y="310" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="692" y="310" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="718" y="310" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><rect x="744" y="310" width="23" height="23" rx="4" fill="#348B73" stroke="none" stroke-width="1" /><text x="705" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>each token sees only</tspan></text><text x="705" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066"><tspan>earlier tokens</tspan></text><rect x="48" y="394" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="422" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>“Decoder-only” still processes the prompt across many layers. It has no separate encoder.</tspan></text></g></svg>
