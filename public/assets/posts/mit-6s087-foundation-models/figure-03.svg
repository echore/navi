<svg xmlns="http://www.w3.org/2000/svg" width="840" height="358" viewBox="0 0 840 358" role="img"><rect width="840" height="358" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>03 / Three Stages, Three Different Jobs</tspan></text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Each stage changes the model for a different reason.</tspan></text><rect x="48" y="108" width="232" height="150" rx="16" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="66" y="126" width="40" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="66" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Pretraining</tspan></text><text x="66" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Learn statistical structure</tspan></text><text x="66" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>and transferable</tspan></text><text x="66" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>representations at scale</tspan></text><path d="M284 183 L300 183" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M291.6 188.4 L300 183 L291.6 177.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="304" y="108" width="232" height="150" rx="16" fill="#FAEDD9" stroke="none" stroke-width="1" /><rect x="322" y="126" width="40" height="6" rx="3" fill="#C99355" stroke="none" stroke-width="1" /><text x="322" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Fine-tuning</tspan></text><text x="322" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Instruction tuning: fit</tspan></text><text x="322" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>specific tasks and</tspan></text><text x="322" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>instruction formats</tspan></text><path d="M540 183 L556 183" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M547.6 188.4 L556 183 L547.6 177.6" stroke="#C99355" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="560" y="108" width="232" height="150" rx="16" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="578" y="126" width="40" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="578" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B"><tspan>Preference / RL</tspan></text><text x="578" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>Adjust behavior: style,</tspan></text><text x="578" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>instruction following,</tspan></text><text x="578" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066"><tspan>task performance</tspan></text><rect x="48" y="282" width="744" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="420" y="310" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B"><tspan>Learning many patterns does not mean answering the way users want.</tspan></text></g></svg>
