<svg xmlns="http://www.w3.org/2000/svg" width="840" height="406" viewBox="0 0 840 406" role="img"><rect width="840" height="406" fill="#FBFCFC" /><g><text x="48" y="47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">09 / Separate Prefill and Decode Workers</text><text x="48" y="79" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Different GPU pools handle different stages.</text><rect x="48" y="124" width="318" height="160" rx="19" fill="#E6F0F7" stroke="none" stroke-width="1" /><text x="207" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B">PREFILL WORKER</text><text x="207" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066">Process input context</text><text x="207" y="229" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066">Often compute-heavy</text><rect x="472" y="124" width="318" height="160" rx="19" fill="#E1F1E9" stroke="none" stroke-width="1" /><text x="631" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B">DECODE WORKER</text><text x="631" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066">Generate tokens step by step</text><text x="631" y="229" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="middle" fill="#647066">Latency / KV capacity</text><path d="M366 205 L462.0 205.0" stroke="#C99355" stroke-width="4" fill="none" /><path d="M462.0 210.0 L472 205 L462.0 200.0" stroke="#C99355" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="419" y="183" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B">KV transfer</text><rect x="48" y="310" width="744" height="63" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="70" y="337" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">Benefit: less direct interference between stages.</text><text x="70" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Cost: transfer time, networking, coordination, and GPU allocation.</text></g></svg>
