<svg xmlns="http://www.w3.org/2000/svg" width="840" height="394" viewBox="0 0 840 394" role="img"><rect width="840" height="394" fill="#FBFCFC" /><g><text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">01 / What Uses GPU Memory?</text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">An 8B model is only part of the memory budget.</text><rect x="48" y="144" width="232" height="146" rx="18" fill="#E6F0F7" stroke="none" stroke-width="1" /><rect x="66" y="165" width="48" height="6" rx="3" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="66" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">Model weights</text><text x="66" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Shared model parameters</text><rect x="299" y="144" width="232" height="146" rx="18" fill="#E1F1E9" stroke="none" stroke-width="1" /><rect x="317" y="165" width="48" height="6" rx="3" fill="#348B73" stroke="none" stroke-width="1" /><text x="317" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">KV cache</text><text x="317" y="239" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Each request’s attention state</text><rect x="550" y="144" width="232" height="146" rx="18" fill="#FAEDD9" stroke="none" stroke-width="1" /><rect x="568" y="165" width="48" height="6" rx="3" fill="#C99355" stroke="none" stroke-width="1" /><text x="568" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">Runtime space</text><text x="568" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Activations and buffers</text><rect x="48" y="317" width="734" height="46" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="415" y="347" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B">Requests share weights, but each independent context needs KV memory.</text></g></svg>
