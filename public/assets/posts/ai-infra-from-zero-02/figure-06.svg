="51" height="54" rx="8" fill="#348B73" stroke="none" stroke-width="1" /><text x="581" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">F</text><text x="581" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">1 token</text><rect x="620" y="230" width="51" height="54" rx="8" fill="#348B73" stroke="none" stroke-width="1" /><text x="645" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">G</text><text x="645" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">1 token</text><rect x="684" y="230" width="51" height="54" rx="8" fill="#348B73" stroke="none" stroke-width="1" /><text x="709" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">H</text><text x="709" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">1 token</text><text x="236" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">≈145 tokens/s total · ≈18 per user</text><rect x="48" y="374" width="738" height="48" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="417" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="middle" fill="#2A241B">Higher total throughput can still mean slower output for each user.</text></g></svg>
