<svg xmlns="http://www.w3.org/2000/svg" width="840" height="456" viewBox="0 0 840 456" role="img"><rect width="840" height="456" fill="#FBFCFC" /><g><text x="48" y="45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">06 / A Larger Batch Can Raise Total Throughput</text><text x="48" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Illustrative decode times, not a hardware benchmark.</text><text x="48" y="118" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">BATCH = 1</text><text x="48" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Step: 20 ms</text><rect x="236" y="98" width="51" height="54" rx="8" fill="#6E98B9" stroke="none" stroke-width="1" /><text x="261" y="121" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">A</text><text x="261" y="140" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">1 token</text><text x="236" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">50 tokens/s total · 50 per user</text><text x="48" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">BATCH = 8</text><text x="48" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Step: 55 ms</text><rect x="236" y="230" width="51" height="54" rx="8" fill="#348B73" stroke="none" stroke-width="1" /><text x="261" y="253" font-family="Arial, Helve