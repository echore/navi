<svg xmlns="http://www.w3.org/2000/svg" width="840" height="402" viewBox="0 0 840 402" role="img"><rect width="840" height="402" fill="#FBFCFC" /><g><text x="48" y="51" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">03 / Longer Contexts Need More KV Memory</text><text x="48" y="85" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">In this example, one 8K-token request needs about 1 GiB of KV cache.</text><text x="48" y="143" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">1 request</text><rect x="156" y="123" width="570" height="31" rx="6" fill="#F4F6F5" stroke="none" stroke-width="1" /><rect x="156" y="123" width="17.8125" height="31" rx="6" fill="#348B73" stroke="none" stroke-width="1" /><text x="746" y="143" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">1 GiB</text><text x="48" y="201" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">8 requests</text><rect x="156" y="181" width="570" height="31" rx="6" fill="#F4F6F5" stroke="none" stroke-width="1" /><rect x="156" y="181" width="142.5" height="31" rx="6" fill="#348B73" stroke="none" stroke-width="1" /><text x="746" y="201" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">8 GiB</text><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">16 requests</text><rect x="156" y="239" width="570" height="31" rx="6" fill="#F4F6F5" stroke="none" stroke-width="1" /><rect x="156" y="239" width="285.0" height="31" rx="6" fill="#348B73" stroke="none" stroke-width="1" /><text x="746" y="259" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">16 GiB</text><text x="48" y="317" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">32 requests</text><rect x="156" y="297" width="570" height="31" rx="6" fill="#F4F6F5" stroke="none" stroke-width="1" /><rect x="156" y="297" width="570.0" height="31" rx="6" fill="#348B73" stroke="none" stroke-width="1" /><text x="746" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">32 GiB</text><text x="48" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">Independent contexts; no prefix sharing, quantization, or offloading.</text></g></svg>
