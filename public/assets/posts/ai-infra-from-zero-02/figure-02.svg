<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><rect width="840" height="380" fill="#FBFCFC" /><g><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">02 / An Example 80 GiB Memory Budget</text><text x="48" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">8B model · BF16 · 30 independent 8K-token contexts</text><rect x="48" y="135" width="137.5" height="78" rx="2" fill="#6E98B9" stroke="none" stroke-width="1" /><rect x="187.5" y="135" width="72.4" height="78" rx="2" fill="#C99355" stroke="none" stroke-width="1" /><rect x="261.9" y="135" width="277.0" height="78" rx="2" fill="#348B73" stroke="none" stroke-width="1" /><rect x="540.9" y="135" width="249.1" height="78" rx="2" fill="#DCE2E1" stroke="none" stroke-width="1" /><text x="113" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">Weights</text><text x="113" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">15 GiB</text><text x="223.7" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B">Runtime</text><text x="223.7" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#2A241B">8 GiB</text><text x="400.4" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#fff">KV cache</text><text x="400.4" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#fff">30 GiB</text><text x="665.45" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" fill="#2A241B">Free space</text><text x="665.45" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" fill="#2A241B">27 GiB</text><text x="48" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" font-style="normal" text-anchor="start" fill="#2A241B">The model fits, but concurrent requests use the remaining memory.</text><rect x="48" y="280" width="744" height="67" rx="12" fill="#F4F6F5" stroke="none" stroke-width="1" /><text x="69" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" font-style="normal" text-anchor="start" fill="#2A241B">KV per token ≈ 128 KiB</text><text x="69" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" fill="#647066">32 layers × 8 KV heads × 128 dimensions × 2 (K/V) × 2 bytes</text></g></svg>
