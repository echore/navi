name: Sync Notion Posts

on:
  # Retired 2026-10-23: posts are now edited directly in src/content/posts.
  # The 30-minute schedule is off. Don't run this manually — it would
  # overwrite hand-edited posts with the old Notion copies.
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Sync Notion → markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync

      - name: Commit synced posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ scripts/published-dates.json
          [ -d public/assets/posts/ ] && git add public/assets/posts/ || true
          git diff --cached --quiet || git commit -m "sync: update posts from Notion"
          git push
