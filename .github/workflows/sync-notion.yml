name: Sync Notion Posts

on:
  # Run every 30 minutes — picks up new Publish status changes
  schedule:
    - cron: '*/30 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Sync Notion → markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync

      - name: Commit synced posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ scripts/published-dates.json
          git diff --cached --quiet || git commit -m "sync: update posts from Notion"
          git push
